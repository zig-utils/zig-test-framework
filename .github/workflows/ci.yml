name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with supported Zig
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read supported Zig version
        id: zig-version
        shell: bash
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@main
        with:
          packages: zig@${{ steps.zig-version.outputs.version }}

      - name: Verify Zig installation
        run: zig version

      - name: Build framework
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Run examples
        run: zig build examples

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read supported Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@main
        with:
          packages: zig@${{ steps.zig-version.outputs.version }}

      - name: Check formatting
        run: zig fmt --check .

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read supported Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@main
        with:
          packages: zig@${{ steps.zig-version.outputs.version }}

      - name: Generate docs
        run: zig build-lib -femit-docs src/lib.zig

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read supported Zig version
        id: zig-version
        run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@main
        with:
          packages: zig@${{ steps.zig-version.outputs.version }}

      - name: Install kcov
        continue-on-error: true
        id: install-kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov

      - name: Build framework
        if: steps.install-kcov.outcome == 'success'
        run: zig build

      - name: Run tests with coverage
        if: steps.install-kcov.outcome == 'success'
        run: ./zig-out/bin/zig-test --test-dir tests --coverage

      - name: Upload coverage to Codecov
        if: steps.install-kcov.outcome == 'success'
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifact
        if: steps.install-kcov.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage skipped
        if: steps.install-kcov.outcome != 'success'
        run: echo "kcov not available on this platform, skipping coverage"

  latest-zig:
    name: Compatibility with latest Zig 0.17.0-dev
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup latest Zig development build
        uses: pantry-pm/pantry/packages/action@main
        with:
          packages: zig@0.17.0-dev

      - name: Verify Zig installation
        run: zig version

      - name: Build framework
        run: zig build

      - name: Run tests
        run: zig build test

      - name: Run examples
        run: zig build examples
